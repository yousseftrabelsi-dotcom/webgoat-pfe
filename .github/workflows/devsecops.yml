name: DevSecOps WebGoat Pipeline
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:
  # 1. Recherche de secrets dans le code
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Analyse statique du code (SAST)
  sast-scan:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=yousseftrabelsi-dotcom
            -Dsonar.projectKey=yousseftrabelsi-dotcom_webgoat-pfe
            -Dsonar.java.binaries=.

  # 3. Analyse des dépendances logicielles (SCA)
  vulnerability-scan:
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Run Trivy
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format json --output trivy-results.json .
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: trivy-results.json

  # 4. Analyse dynamique (DAST) avec OWASP ZAP
  dast-scan:
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Démarrer WebGoat via Docker
        run: |
          docker run -d -p 8080:8080 webgoat/webgoat
          echo "Attente du démarrage de WebGoat (45 secondes)..."
          sleep 45

      - name: Préparer les permissions pour ZAP
        run: chmod 777 .

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080/WebGoat'
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: report_html.html

  # 5. Analyse et résumé par Intelligence Artificielle
  ai-agent-analysis:
    needs: dast-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: reports
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install AI Tool
        run: pip install google-genai
      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai_analyzer.py
          echo "=== VOICI L'ANALYSE DE L'IA ==="
          cat ai-security-summary.txt
      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report # On change le nom pour le retrouver facilement
          path: ai-security-summary.txt

  # 6. Génération du Dashboard Global (Nouveau)
  generate-dashboard:
    needs: ai-agent-analysis
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Télécharger tous les rapports (Trivy + AI)
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installer Plotly
        run: pip install plotly

      - name: Créer le Dashboard Interactif
        run: python scripts/generate_dashboard.py

      - name: Upload Global Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Dashboard
          path: global_security_report.html
