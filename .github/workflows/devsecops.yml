name: Pipeline DevSecOps PFE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. SAST (Analyse Statique)
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ici, tu peux ajouter ton action SonarCloud ou Semgrep
      - name: Placeholder SAST
        run: echo "Analyse SAST effectuée."

  # 2. SECRETS (Gitleaks)
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # Ne bloque pas le build pour pouvoir générer le dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Préparer le rapport Gitleaks
        run: |
          if [ -f "results.json" ]; then mv results.json gitleaks-report.json; fi
      - name: Upload Artifact Gitleaks
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # 3. SCA (Dépendances)
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-results.json'
      - name: Upload Artifact Trivy
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

  # 4. DAST (OWASP ZAP)
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Déploiement temporaire de l'app pour scanner (Ex: docker run -d webgoat)
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'https://example.com' # REMPLACE par l'URL de ton WebGoat (ex: localhost:8080)
          format: 'json'
      - name: Renommer le rapport ZAP pour le dashboard
        run: cp report_json.json zap-results.json || true
      - name: Upload Artifact ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-report # Nom corrigé par rapport à l'erreur de ta capture d'écran
          path: zap-results.json
          if-no-files-found: ignore

  # 5. RUNTIME (Falco - Simulation pour PFE)
  runtime-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer log Falco
        run: |
          # Simulation de détection Falco pour le dashboard
          echo '{"priority": "Notice", "rule": "Terminal shell in container"}' > falco-results.json
          echo '{"priority": "Critical", "rule": "Read sensitive file untrusted"}' >> falco-results.json
      - name: Upload Artifact Falco
        uses: actions/upload-artifact@v4
        with:
          name: falco-report
          path: falco-results.json

  # 6. GÉNÉRATION DU DASHBOARD GLOBLAL
  generate-dashboard:
    needs: [sast-scan, secrets-scan, sca-scan, dast-scan, runtime-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install plotly pandas

      # Récupération de TOUS les artefacts générés par les jobs précédents
      - uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: .
        continue-on-error: true
        
      - uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .
        continue-on-error: true
        
      - uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: .
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: falco-report
          path: .
        continue-on-error: true

      # Génération du fichier AI (Si tu n'as pas l'API branchée en direct)
      - name: Mock AI Summary
        run: echo "Analyse DevSecOps du commit ${{ github.sha }}. Des vulnérabilités critiques ont été trouvées par Trivy. Gitleaks a audité les secrets. Falco a détecté des comportements suspects en runtime. Action requise." > ai_summary.txt

      - name: Générer le HTML
        run: python scripts/generate_dashboard.py

      - name: Upload Dashboard Final
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Dashboard
          path: global_security_report.html
