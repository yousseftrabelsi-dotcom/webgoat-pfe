name: DevSecOps WebGoat Pipeline
on:
  push:
    branches: [ "main" ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerability-scan:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Image Docker
        run: docker build -t webgoat-pfe .
      - name: Run Trivy Scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image --format json --output trivy-results.json webgoat-pfe
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: trivy-results.json

  ai-agent-analysis:
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: reports
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install AI Tool
        run: pip install google-generativeai
      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai_analyzer.py
          echo "=== VOICI L'ANALYSE DE L'IA ==="
          cat ai-security-summary.txt
      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        with:
          name: PFE-AI-Report
          path: ai-security-summary.txt
