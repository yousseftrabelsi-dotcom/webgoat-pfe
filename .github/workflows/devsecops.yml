name: DevSecOps WebGoat Pipeline
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:
  # 1. Recherche de secrets dans le code (Gitleaks)
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks
        continue-on-error: true
        run: |
          # Téléchargement et installation directe (comme pour Trivy)
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
          
          # Lancement du scan en FORÇANT la création du fichier results.sarif
          gitleaks detect --source . --report-format sarif --report-path results.sarif

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
  # 2. Analyse statique du code (SonarCloud)
  sast-scan:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=yousseftrabelsi-dotcom
            -Dsonar.projectKey=yousseftrabelsi-dotcom_webgoat-pfe
            -Dsonar.java.binaries=.

  # 3. Analyse des dépendances (Trivy)
  vulnerability-scan:
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Run Trivy
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format json --output trivy-results.json .
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-results.json

  # 4. Analyse dynamique (OWASP ZAP)
  dast-scan:
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Démarrer WebGoat via Docker
        run: |
          docker run -d -p 8080:8080 webgoat/webgoat
          echo "Attente du démarrage de WebGoat (45 secondes)..."
          sleep 45

      - name: Préparer les permissions
        run: chmod 777 .

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080/WebGoat'
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: report_html.html

  # 5. Sécurité Runtime (Falco) - NOUVEAU JOB
  falco-scan:
    needs: dast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Lancer Falco en mode conteneur privilégié
        run: |
          docker run -d --name falco --privileged \
            -v /var/run/docker.sock:/host/var/run/docker.sock \
            -v /dev:/host/dev \
            -v /proc:/host/proc:ro \
            -v /boot:/host/boot:ro \
            -v /lib/modules:/host/lib/modules:ro \
            -v /usr:/host/usr:ro \
            -e FALCO_JSON_OUTPUT=true \
            falcosecurity/falco:latest
          echo "Attente de l'initialisation de Falco..."
          sleep 15

      - name: Démarrer WebGoat (Cible)
        run: |
          docker run -d --name webgoat-target -p 8080:8080 webgoat/webgoat
          sleep 20
          
      - name: Simuler des attaques pour déclencher Falco
        run: |
          echo "Simulation d'une attaque sur WebGoat..."
          # Simulation 1 : Tentative de lecture d'un fichier sensible
          docker exec webgoat-target cat /etc/shadow || true
          # Simulation 2 : Ouverture d'un shell interactif inattendu
          docker exec webgoat-target bash -c "ls -la /root" || true
          sleep 5
          
      - name: Capturer les alertes Falco
        run: |
          docker logs falco > falco-results.json
          
      - name: Upload Falco Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falco-report
          path: falco-results.json

  # 6. Analyse par Intelligence Artificielle (Gemini)
  ai-agent-analysis:
    needs: falco-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: reports
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: pip install google-genai
      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai_analyzer.py
      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: ai-security-summary.txt

  # 7. Génération du Dashboard Global
  generate-dashboard:
    needs: ai-agent-analysis
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Télécharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installer Plotly
        run: pip install plotly

      - name: Créer le Dashboard
        run: python scripts/generate_dashboard.py

      - name: Upload Final Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Dashboard
          path: global_security_report.html
