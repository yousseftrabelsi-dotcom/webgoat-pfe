name: DevSecOps WebGoat Pipeline

on:
  push:
    branches: ["main"]

# Permissions minimales au niveau global
permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1 — Scans statiques en PARALLÈLE
  # ═══════════════════════════════════════════════════════════════════

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks detect --source . --report-format sarif --report-path results.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate if secrets found
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::Gitleaks a détecté des secrets dans le code source !"
          echo "::error::Consultez l'artefact gitleaks-results pour les détails."

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: results.sarif

  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=yousseftrabelsi-dotcom
            -Dsonar.projectKey=yousseftrabelsi-dotcom_webgoat-pfe
            -Dsonar.java.binaries=.

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Run Trivy (TOUS niveaux)
        id: trivy
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          # ✅ --severity ALL (Critical+High+Medium+Low)
          trivy fs --format json --output trivy-results.json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL .
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate Trivy result
        run: |
          if [ "${{ steps.trivy.outputs.exit_code }}" != "0" ]; then
            echo "::warning::Trivy a trouvé des vulnérabilités CRITIQUES dans les dépendances !"
          else
            echo "Aucune vulnérabilité critique détectée par Trivy."
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy
          path: trivy-results.json

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2 — Scans dynamiques
  # ═══════════════════════════════════════════════════════════════════

  dast-scan:
    needs: [secrets-scan, sast-scan, vulnerability-scan]  # ✅ CORRIGÉ : ] fermante ajoutée
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    
    - name: Start WebGoat + Healthcheck
      run: |
        docker run -d --name webgoat -p 8080:8080 webgoat/webgoat
        for i in {1..30}; do
          if curl -f http://localhost:8080/WebGoat/login >/dev/null 2>&1; then
            echo "✅ WebGoat UP après $i tentatives"
            break
          fi
          echo "⏳ Wait $i/30..."
          sleep 3
        done || echo "⚠️ WebGoat lent mais ZAP continue"
    
    - name: ZAP Baseline Scan (No GitHub Issues)
      continue-on-error: true
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: 'http://localhost:8080/WebGoat'
    
    - name: Cleanup
      if: always()
      run: docker rm -f webgoat
    
    - name: Upload ZAP Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: report-zap
        path: |
          report_html.html
          report_json.json
          report_md.md

  falco-scan:
    needs: [secrets-scan, sast-scan, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Falco Events (Vos données personnalisées)
        run: |
          # ✅ 2 Notice, 1 Warning, 3 Error, 0 Critical (exactement vos specs)
          cat > falco-results.json << 'EOF'
          {"priority": "Notice", "output": "Shell spawned in container (ubuntu)", "time": "2026-04-27T19:30:00Z"}
          {"priority": "Notice", "output": "Shell spawned in container (alpine)", "time": "2026-04-27T19:30:05Z"}
          {"priority": "Warning", "output": "Write below root path /etc/malware", "time": "2026-04-27T19:30:10Z"}
          {"priority": "Error", "output": "Read sensitive file /etc/passwd unauthorized", "time": "2026-04-27T19:30:15Z"}
          {"priority": "Error", "output": "Read sensitive file /etc/shadow unauthorized", "time": "2026-04-27T19:30:20Z"}
          {"priority": "Error", "output": "Unexpected process execution nc", "time": "2026-04-27T19:30:25Z"}
          EOF
          
          echo "✅ Falco généré : $(jq 'group_by(.priority) | map({priority: .[0].priority, count: length})[]' falco-results.json)"
          echo "Total alertes: $(wc -l < falco-results.json)"
          cat falco-results.json
      
      - name: Upload Falco Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-falco
          path: falco-results.json
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3a — Analyse IA
  # ═══════════════════════════════════════════════════════════════════

  ai-agent-analysis:
    needs: [dast-scan, falco-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: report-trivy
        continue-on-error: true

      - name: Download Gitleaks report
        uses: actions/download-artifact@v4
        with:
          name: report-gitleaks
        continue-on-error: true

      - name: Download ZAP report
        uses: actions/download-artifact@v4
        with:
          name: report-zap
        continue-on-error: true

      - name: Download Falco report
        uses: actions/download-artifact@v4
        with:
          name: report-falco
        continue-on-error: true

      - name: List available reports
        run: ls -lah *.json *.sarif *.html 2>/dev/null || echo "Certains rapports sont manquants."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_analyzer.py

      - name: Upload AI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-ai
          path: ai-security-summary.txt

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3b — Dashboard final
  # ═══════════════════════════════════════════════════════════════════

  generate-dashboard:
    needs: ai-agent-analysis
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Flatten artifacts to working directory
        run: |
          find artifacts/ -type f | while read f; do
            cp "$f" . && echo "Copié : $f"
          done
          echo "=== Fichiers disponibles pour le dashboard ==="
          ls -lah *.json *.sarif *.html *.txt 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install plotly markdown 

      - name: Generate Dashboard
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python scripts/generate_dashboard.py

      - name: Upload Final Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Dashboard
          path: global_security_report.html
          retention-days: 30
