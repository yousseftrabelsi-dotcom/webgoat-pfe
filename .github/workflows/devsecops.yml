# ══════════════════════════════════════════════════════════════════════════════
# DevSecOps WebGoat Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# PHASE 1 │ Scans statiques   : Gitleaks · SonarCloud · Trivy · Checkov (IaC)
# PHASE 2 │ Scans dynamiques  : OWASP ZAP · Falco
# PHASE 3 │ IA + Dashboard    : Gemini · Plotly (+ Matrice OWASP)
# PHASE 4 │ Quality Gate      : bloque le pipeline si seuils dépassés
# PHASE 5 │ Notification      : résumé Slack après chaque run
# ══════════════════════════════════════════════════════════════════════════════

name: DevSecOps WebGoat Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: read

# ══════════════════════════════════════════════════════════════════════════════
# PHASE 1 — SCANS STATIQUES (parallèles)
# ══════════════════════════════════════════════════════════════════════════════

jobs:

  # ── 1a. Détection de secrets ───────────────────────────────────────────────
  secrets-scan:
    name: "🔑 Secrets — Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks detect --source . --report-format sarif --report-path results.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate if secrets found
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::Gitleaks a détecté des secrets dans le code source !"
          echo "::error::Consultez l'artefact report-gitleaks pour les détails."

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: results.sarif

  # ── 1b. Analyse statique du code ──────────────────────────────────────────
  sast-scan:
    name: "🔍 SAST — SonarCloud"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=yousseftrabelsi-dotcom
            -Dsonar.projectKey=yousseftrabelsi-dotcom_webgoat-pfe
            -Dsonar.java.binaries=.

      - name: Export SonarCloud metrics (JSON)
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -sf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?\
          component=yousseftrabelsi-dotcom_webgoat-pfe&\
          metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,\
          coverage,duplicated_lines_density,sqale_rating,reliability_rating,security_rating" \
            -o sonar-results.json \
            && echo "✅ SonarCloud metrics exportées." \
            || echo "::warning::Export SonarCloud échoué (token ou quota)."

      - name: Upload SonarCloud Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sonar
          path: sonar-results.json

  # ── 1c. Analyse des dépendances ───────────────────────────────────────────
  vulnerability-scan:
    name: "📦 SCA — Trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Trivy (tous niveaux)
        id: trivy
        continue-on-error: true
        run: |
          trivy fs --format json --output trivy-results.json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL .
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Annotate Trivy result
        run: |
          if [ "${{ steps.trivy.outputs.exit_code }}" != "0" ]; then
            echo "::warning::Trivy a trouvé des vulnérabilités CRITIQUES dans les dépendances !"
          else
            echo "✅ Aucune vulnérabilité critique détectée par Trivy."
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy
          path: trivy-results.json

  # ── 1d. Scan IaC — Checkov ────────────────────────────────────────────────
  iac-scan:
    name: "🏗️ IaC — Checkov"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Run IaC Scan
        id: checkov
        continue-on-error: true   # Ne bloque pas le pipeline, le Quality Gate décide
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/iac_scan.py

      - name: Annotate IaC result
        if: steps.checkov.outputs.exit_code == '1' || failure()
        run: |
          echo "::warning::Checkov a détecté des mauvaises configurations IaC."
          echo "::warning::Consultez l'artefact report-checkov pour les détails."

      - name: Upload Checkov Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-checkov
          path: |
            checkov-results.json
            checkov-summary.txt

# ══════════════════════════════════════════════════════════════════════════════
# PHASE 2 — SCANS DYNAMIQUES
# ══════════════════════════════════════════════════════════════════════════════

  # ── 2a. Analyse dynamique web ─────────────────────────────────────────────
  dast-scan:
    name: "🌐 DAST — OWASP ZAP"
    needs: [secrets-scan, sast-scan, vulnerability-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Start WebGoat + Healthcheck
        run: |
          docker run -d --name webgoat -p 8080:8080 webgoat/webgoat
          for i in {1..30}; do
            if curl -sf http://localhost:8080/WebGoat/login >/dev/null 2>&1; then
              echo "✅ WebGoat UP après $i tentatives"; break
            fi
            echo "⏳ Attente $i/30…"; sleep 3
          done || echo "⚠️ WebGoat lent mais ZAP continue"

      - name: ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080/WebGoat'

      - name: Cleanup WebGoat container
        if: always()
        run: docker rm -f webgoat

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-zap
          path: |
            report_html.html
            report_json.json
            report_md.md

  # ── 2b. Surveillance Runtime ──────────────────────────────────────────────
  falco-scan:
    name: "⚡ Runtime — Falco"
    needs: [secrets-scan, sast-scan, vulnerability-scan, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Falco Events
        run: |
          # Données simulées : 2 Notice · 1 Warning · 3 Error · 0 Critical
          cat > falco-results.json << 'EOF'
          {"priority": "Notice",  "output": "Shell spawned in container (ubuntu)",         "time": "2026-04-27T19:30:00Z"}
          {"priority": "Notice",  "output": "Shell spawned in container (alpine)",          "time": "2026-04-27T19:30:05Z"}
          {"priority": "Warning", "output": "Write below root path /etc/malware",           "time": "2026-04-27T19:30:10Z"}
          {"priority": "Error",   "output": "Read sensitive file /etc/passwd unauthorized", "time": "2026-04-27T19:30:15Z"}
          {"priority": "Error",   "output": "Read sensitive file /etc/shadow unauthorized", "time": "2026-04-27T19:30:20Z"}
          {"priority": "Error",   "output": "Unexpected process execution nc",              "time": "2026-04-27T19:30:25Z"}
          EOF
          echo "✅ Falco : $(wc -l < falco-results.json) événements générés."

      - name: Upload Falco Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-falco
          path: falco-results.json

# ══════════════════════════════════════════════════════════════════════════════
# PHASE 3 — ANALYSE IA + DASHBOARD (avec Matrice OWASP)
# ══════════════════════════════════════════════════════════════════════════════

  ai-agent-analysis:
    name: "🤖 Analyse IA — Gemini"
    needs: [dast-scan, falco-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Flatten artifacts to working directory
        run: |
          find artifacts/ -type f | while read f; do
            # Si la destination est un dossier (artifact mal aplati), on le supprime
            dest=$(basename "$f")
            [ -d "$dest" ] && rm -rf "$dest"
            cp "$f" . && echo "Copié : $f → $dest"
          done
          echo "=== Fichiers disponibles ==="
          ls -lah *.json *.sarif *.html *.txt 2>/dev/null || true

      - name: List available reports
        run: ls -lah *.json *.sarif *.html 2>/dev/null || echo "Certains rapports sont manquants."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_analyzer.py

      - name: Upload AI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-ai
          path: ai-security-summary.txt

  generate-dashboard:
    name: "📊 Dashboard — Plotly + OWASP Matrix"
    needs: ai-agent-analysis
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Flatten artifacts to working directory
        run: |
          find artifacts/ -type f | while read f; do
            cp "$f" . && echo "Copié : $f"
          done
          echo "=== Fichiers disponibles pour le dashboard ==="
          ls -lah *.json *.sarif *.html *.txt 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install plotly

      - name: Generate Dashboard
        env:
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_ACTOR:      ${{ github.actor }}
        run: python scripts/generate_dashboard.py

      - name: Upload Final Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Dashboard
          path: global_security_report.html
          retention-days: 30

# ══════════════════════════════════════════════════════════════════════════════
# PHASE 4 — QUALITY GATE (bloque le déploiement si seuils dépassés)
# ══════════════════════════════════════════════════════════════════════════════

quality-gate:
    name: "🚦 Quality Gate"
    needs: generate-dashboard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Flatten artifacts to working directory
        run: |
          find artifacts/ -type f | while read f; do cp "$f" .; done
          ls -lah *.json *.sarif *.txt 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Quality Gate
        id: gate
        continue-on-error: true
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/quality_gate.py

      # --- C'EST CETTE ÉTAPE QUI CHANGE ---
      - name: 📦 Regrouper et Sauvegarder les rapports finaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Final-Reports
          path: |
            global_security_report.html
            quality_gate_report.html
            quality_gate_report.txt

      # Avertissement informatif — le job reste vert même si le gate bloque
      - name: Quality Gate Status
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" == "failure" ]; then
            echo "::warning::🚫 Quality Gate — Déploiement BLOQUÉ. Consultez report-quality-gate pour les détails."
          else
            echo "::notice::✅ Quality Gate — Déploiement AUTORISÉ."
          fi
# ══════════════════════════════════════════════════════════════════════════════
# PHASE 5 — NOTIFICATION SLACK (toujours exécutée, même si le gate échoue)
# ══════════════════════════════════════════════════════════════════════════════

  notify-slack:
    name: "💬 Notification — Slack"
    needs: quality-gate
    if: always()   # S'exécute que le pipeline ait réussi ou échoué
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Flatten artifacts to working directory
        run: |
          find artifacts/ -type f | while read f; do cp "$f" .; done
          ls -lah *.json *.sarif *.txt 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_ACTOR:      ${{ github.actor }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify_slack.py
